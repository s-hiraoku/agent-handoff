[package]
name = "agent-handoff"
version = "0.4.0"
edition = "2024"
description = "Local-first agent-to-agent messaging, context handoff, and background task runtime"
license = "MIT"
repository = "https://github.com/s-hiraoku/agent-handoff"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
uuid = { version = "1.19.0", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.23.0"

[[bin]]
name = "handoff"
path = "src/main.rs"
