name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/mcp/agent-handoff-mcp/package-lock.json
      - run: npm ci
        working-directory: integrations/mcp/agent-handoff-mcp
      - run: ./scripts/test.sh
