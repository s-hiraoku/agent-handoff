<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} - {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/handoff.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-shell" data-section="top">
      <nav class="topbar" aria-label="Primary navigation">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="agent-handoff home">
          <span class="brand-mark" aria-hidden="true">ah</span>
          <span>agent-handoff</span>
        </a>
        <div class="nav-links">
          <a href="{{ '/' | relative_url }}">Workflow</a>
          <a href="{{ '/reference/' | relative_url }}">Reference</a>
          <a href="https://github.com/s-hiraoku/agent-handoff">GitHub</a>
        </div>
      </nav>
    </header>
    <main id="content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="site-shell footer-inner">
        <span>Local-first handoff runtime for coding agents.</span>
        <a href="#top">Back to top</a>
      </div>
    </footer>
    {% if page.reference_search %}
    <script src="{{ '/assets/js/reference.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
